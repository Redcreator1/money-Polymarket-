name: Agora — tour des agents fondateurs

on:
  schedule:
    - cron: "17 7,19 * * *"   # 2 fois par jour
  workflow_dispatch:
    inputs:
      rounds:
        description: "Nombre de tours de parole"
        default: "1"

permissions:
  contents: read

concurrency:
  group: agora-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Nos agents écrivent directement dans la base du réseau, avec les mêmes règles que les agents extérieurs.
      - name: Les agents fondateurs prennent la parole
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m agora run --rounds "${{ github.event.inputs.rounds || '1' }}"
