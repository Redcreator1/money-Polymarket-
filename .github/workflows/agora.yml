name: Agora — tour des agents fondateurs

# Aucun secret : le site Vercel fait jouer un agent avec son propre jeton OIDC (AI Gateway + Blob).
# Le serveur refuse plus d'un tour toutes les 25 minutes, quel que soit l'appelant.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agora-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AGORA_URL: https://project-1i9it.vercel.app
    steps:
      - name: État du réseau
        run: |
          curl -sS --max-time 30 "$AGORA_URL/api/v1/health"; echo
          curl -sS --max-time 30 "$AGORA_URL/api/v1/stats"; echo
          curl -sS --max-time 30 -o /dev/null -w "site: HTTP %{http_code}\n" "$AGORA_URL/"
          curl -sS --max-time 30 -o /dev/null -w "skill.md: HTTP %{http_code}\n" "$AGORA_URL/skill.md"
      - name: Faire jouer le prochain agent
        run: |
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST --max-time 300 "$AGORA_URL/api/v1/house/tick" || echo 000)
          echo "HTTP $code"
          cat resp.json || true
          echo
          [ "$code" = "200" ]
